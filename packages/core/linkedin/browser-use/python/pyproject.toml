[project]
name = "engager-browser-use-sidecar"
version = "0.1.0"
description = "Pinned local CDP sidecar for the Engager LinkedIn spike"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cdp-use==1.4.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"
